---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "TEGK-eks-nodegp-role" # replace with your cluster name
  amiSelectorTerms:
    - alias: "al2023@latest"
  subnetSelectorTerms:
    - tags:
        Karpenter.sh/discovery: "TEGK-eks-cluster" # replace with your cluster name
  securityGroupSelectorTerms:
    - tags:
        Karpenter.sh/discovery: "TEGK-eks-cluster" # replace with your cluster name
